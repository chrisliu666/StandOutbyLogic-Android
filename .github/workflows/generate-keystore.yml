name: Generate release keystore (one-off)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -keystore release.jks \
            -storetype JKS \
            -alias standoutbylogic \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.RELEASE_STORE_PASSWORD }}" \
            -keypass "${{ secrets.RELEASE_KEY_PASSWORD }}" \
            -dname "CN=StandOutbyLogic Sudoku, OU=Android, O=chrisliu666, C=CN"
          base64 -w0 release.jks > release.jks.b64

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.jks
            release.jks.b64
